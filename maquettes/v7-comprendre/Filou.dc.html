<script type="text/x-dc" data-dc-script data-props='{"situation":{"editor":"enum","default":"awake","options":["awake","night","nap","fell","woke","approach","new","none"]},"age":{"editor":"enum","default":2,"options":[0,1,2]},"medal":{"editor":"boolean","default":false},"defs":{"editor":"boolean","default":true},"skipTick":{"editor":null},"onPose":{"editor":null},"onTap":{"editor":null},"$preview":{"width":358,"height":270}}'>
class Component extends DCLogic {
  /* Filou : trois couches.
     1. situation (donnée réelle ou estimée) -> pose de base, jamais de saut : on passe par des poses passerelles.
     2. ambiance continue (respiration, clignements, oreilles) réglée par le tempo (calme ou non).
     3. comportements ponctuels, tirés dans une liste sans répétition visible (balade, jeu, toilette, atchoum, roulade). */
  st() { return this.state || {}; }
  componentDidMount() {
    this._t = [];
    this._cycle = 0;
    this._tapN = 0;
    this._busy = false;
    this.apply(this.props.situation || 'awake', true);
  }
  componentDidUpdate(prev) {
    if (prev.situation !== this.props.situation) this.apply(this.props.situation || 'awake', false);
    if (prev.skipTick !== this.props.skipTick) this.skip();
  }
  componentWillUnmount() { this.clear(); }
  clear() { (this._t || []).forEach(t => clearTimeout(t)); this._t = []; }
  later(ms, fn) { this._t.push(setTimeout(fn, ms)); }
  say(label) { const f = this.props.onPose; if (typeof f === 'function') f(label); }
  mode() { return this.st().mode || 'awake'; }
  sleeping() { const m = this.mode(); return m === 'nap' || m === 'night'; }

  /* Enchaîne des poses [mode, durée ms, libellé], puis appelle done. */
  seq(steps, done) {
    let i = 0;
    const next = () => {
      if (i >= steps.length) { this._busy = false; if (done) done(); return; }
      const s = steps[i++];
      this.setState({ mode: s[0] });
      this.say(s[2]);
      this.later(s[1], next);
    };
    this._busy = true;
    next();
  }

  apply(sit, initial) {
    this.clear();
    if (this.props.still) { this.setState({ mode: 'awake', calmLvl: 3 }); return; }
    this._busy = false;
    this._lvl = 0;
    const target = sit === 'night' ? 'night' : (sit === 'nap' || sit === 'fell') ? 'nap' : null;
    this.setState({ calmLvl: sit === 'none' ? 3 : 0, fresh: sit === 'new', stir: false });
    if (target) {
      const label = target === 'night' ? 'Dort paisiblement (nuit)' : 'Dort (sieste)';
      if (initial || this.sleeping()) { this.setState({ mode: target }); this.say(label); return; }
      /* Déjà posé (assis ou couché) : il s'allonge directement. Sinon il se détend, puis se couche. */
      const m = this.mode();
      if (m === 'sit' || m === 'lie') this.seq([['lie', 2200, 'S’allonge, se détend'], [target, 1, label]]);
      else this.seq([['tired', 3200, 'Se détend, ferme les yeux'], ['lie', 2000, 'S’installe pour dormir'], [target, 1, label]]);
      return;
    }
    if (this.sleeping()) {
      this._cycle = 0;
      this.seq([['lie', 1800, 'Rouvre un œil'], ['stretch', 2800, 'S’étire, baille']], () => this.loop());
      return;
    }
    if (sit === 'woke') { this._cycle = 0; this.seq([['stretch', 2800, 'S’étire, baille']], () => this.loop()); return; }
    if (sit === 'new') { this.seq([['hug', 3900, 'Câlin au doudou : une broderie vient d’être cousue']], () => this.loop()); return; }
    this.loop();
  }

  /* Boucle d'éveil : balade et jeu en alternance, avec des intermèdes variés. */
  loop() {
    this.clear();
    /* Calme progressif : en approche de la fenêtre habituelle, le niveau monte d'un cran à chaque comportement
       (0 normal, 1 à 3 de plus en plus lent). Dans l'app réelle la montée suivra le temps (environ 5 minutes). */
    const sit = this.props.situation;
    const lvl = sit === 'none' ? 3 : (sit === 'approach' ? Math.min(3, this._lvl || 0) : 0);
    if (sit === 'approach') this._lvl = (this._lvl || 0) + 1;
    this.setState({ calmLvl: lvl });
    const orders = [
      ['balade', 'groom', 'play', 'balade', 'sneeze', 'play', 'balade', 'roll'],
      ['balade', 'groom', 'balade', 'sit'],
      ['balade', 'sit', 'groom', 'sit'],
      ['balade', 'sit', 'balade', 'groom', 'sit']
    ];
    const order = orders[lvl];
    const kind = order[this._cycle % order.length];
    this._cycle++;
    const sitMs = [8000, 8000, 11000, 15000][lvl];
    const walkMs = [26000, 32000, 38000, 44000][lvl];
    const dur = { play: 4900, groom: 4300, sneeze: 3500, roll: 3100 };
    const names = { balade: 'Il se balade', play: 'Il joue avec sa pelote', groom: 'Toilette', sneeze: 'Atchoum, une marguerite', roll: 'Roulade', sit: 'Assis tranquille, suit le papillon' };
    this.say(names[kind]);
    this._waitIter = false;
    if (kind === 'balade') {
      this.setState({ mode: 'awake' });
      this._waitIter = true;
      this.later(walkMs, () => this.loop());
    } else if (kind === 'sit') {
      this.setState({ mode: 'sit' });
      this.later(sitMs, () => this.loop());
    } else {
      this.setState({ mode: kind });
      this.later(dur[kind] + 600, () => this.loop());
    }
  }

  onIter(e) {
    if (!this._waitIter || !e || e.animationName !== 'flWander' || e.target !== e.currentTarget) return;
    this._waitIter = false;
    this.loop();
  }

  skip() {
    if (this._busy || this.sleeping()) return;
    this.loop();
  }

  tap() {
    const f = this.props.onTap;
    if (typeof f === 'function') f(this.mode());
    if (this._busy) return;
    if (this.sleeping()) {
      this.setState({ stir: true });
      this.later(1500, () => this.setState({ stir: false }));
      return;
    }
    this.clear();
    const order = ['sneeze', 'play', 'roll'];
    const m = order[this._tapN % 3];
    this._tapN++;
    const dur = { sneeze: 3500, play: 4900, roll: 3100 };
    const names = { sneeze: 'Atchoum, une marguerite', play: 'Il joue avec sa pelote', roll: 'Roulade' };
    this.seq([[m, dur[m] + 400, names[m]]], () => this.loop());
  }

  renderVals() {
    const s = this.st();
    const age = this.props.age === undefined || this.props.age === null ? 2 : Number(this.props.age);
    let cls = 'fl-s-' + (s.mode || 'awake') + ' fl-acc-scarf fl-age' + age;
    if (age >= 2) cls += ' fl-acc-daisy';
    if (age === 0) cls += ' fl-acc-bonnet';
    if (this.props.medal) cls += ' fl-acc-medal';
    if (s.calmLvl) cls += ' fl-calm fl-calm' + s.calmLvl;
    if (s.calmLvl >= 2 && this.props.paci !== false && this.props.situation === 'approach') cls += ' fl-paci';
    if (s.stir) cls += ' fl-stir';
    if (s.fresh) cls += ' fl-new';
    const vol = (this.props.vol === undefined || this.props.vol === null) ? 1 : Number(this.props.vol);
    if (vol) cls += ' fl-vol' + vol;
    if (this.props.still) cls += ' fl-still';
    return {
      sceneCls: cls,
      showDefs: this.props.defs !== false,
      tap: () => this.tap(),
      onIter: (e) => this.onIter(e)
    };
  }
}
</script>
