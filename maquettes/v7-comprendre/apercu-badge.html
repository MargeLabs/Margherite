<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><style>body{margin:0;padding:16px;background:#FAF7F0;font-family:system-ui,sans-serif;--fd:system-ui;color:#2E2A44}h2{margin:0 0 12px;font-size:20px}.hero{position:relative;height:270px;border-radius:24px;background:linear-gradient(#DDF1E4,#C7E9D2);overflow:hidden}.fox{position:absolute;left:50%;bottom:30px;width:110px;height:70px;margin-left:-55px;border-radius:50% 50% 40% 40%;background:#E58A6A}.cp-patch{display:grid;place-items:center}.ti-but{background:#FFE7A0;color:#7A5A00}svg.cp-sym{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}svg.cp-sym.dash{stroke-dasharray:2.4 3.2}button{border:0;font-family:inherit}
