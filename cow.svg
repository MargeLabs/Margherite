    <path d="M517 172Q556 190 550 256" fill="none" stroke="#FFFDF8" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="550" cy="264" rx="9" ry="15" fill="#2B2A26"/>

    <!-- pattes arrière-plan -->
    <g fill="#E6DFCF">
      <rect x="228" y="236" width="24" height="68" rx="10"/>
      <rect x="436" y="236" width="24" height="68" rx="10"/>
    </g>

    <!-- pis -->
    <ellipse cx="390" cy="272" rx="38" ry="28" fill="#F2B5B0"/>
    <g fill="#E89C98">
      <rect x="368" y="290" width="9" height="13" rx="4.5"/>
      <rect x="386" y="294" width="9" height="13" rx="4.5"/>
      <rect x="404" y="290" width="9" height="13" rx="4.5"/>
    </g>

    <!-- pattes premier plan -->
    <g fill="#FFFDF8">
      <rect x="188" y="236" width="28" height="68" rx="11"/>
      <rect x="468" y="236" width="28" height="68" rx="11"/>
    </g>
    <g fill="#2B2A26">
