<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFDCE8"/>
      <stop offset="0.6" stop-color="#E8F2EE"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <rect x="200" y="150" width="320" height="120" rx="60"/>
      <rect x="135" y="165" width="120" height="95" rx="38"/>
    </clipPath>
    <clipPath id="headClip">
      <path d="M120 160C120 125 220 125 220 160C222 190 205 215 195 232L145 232C135 215 118 190 120 160Z"/>
    </clipPath>
    <g id="daisy">
      <g fill="#FFFDF8">
        <ellipse cy="-6.5" rx="3" ry="5"/>
        <ellipse cy="-6.5" rx="3" ry="5" transform="rotate(45)"/>
        <ellipse cy="-6.5" rx="3" ry="5" transform="rotate(90)"/>
        <ellipse cy="-6.5" rx="3" ry="5" transform="rotate(135)"/>
        <ellipse cy="-6.5" rx="3" ry="5" transform="rotate(180)"/>
        <ellipse cy="-6.5" rx="3" ry="5" transform="rotate(225)"/>
        <ellipse cy="-6.5" rx="3" ry="5" transform="rotate(270)"/>
        <ellipse cy="-6.5" rx="3" ry="5" transform="rotate(315)"/>
      </g>
      <circle r="3.4" fill="#E8B923"/>
    </g>
    <path id="tuft" d="M0 0Q-3-8-7-11M0 0Q0-10 1-15M0 0Q3-8 8-10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </defs>

  <!-- ciel -->
  <rect width="640" height="270" fill="url(#sky)"/>
  <circle cx="560" cy="52" r="44" fill="#F6D66B" opacity=".3"/>
  <circle cx="560" cy="52" r="26" fill="#F6D66B"/>
  <g fill="#FFFDF8" opacity=".9">
    <ellipse cx="96" cy="46" rx="34" ry="9"/><ellipse cx="116" cy="38" rx="22" ry="9"/>
    <ellipse cx="400" cy="30" rx="30" ry="8"/><ellipse cx="418" cy="23" rx="18" ry="8"/>
  </g>

  <!-- collines -->
  <path d="M0 150Q150 118 300 145T640 132V270H0Z" fill="#A8CDB2"/>
  <path d="M0 178Q200 148 400 172T640 160V270H0Z" fill="#86BC9A"/>
  <path d="M0 205Q220 188 440 203T640 195V270H0Z" fill="#62A07F"/>
  <path d="M0 248Q320 232 640 246V270H0Z" fill="#437F66"/>

  <!-- vache -->
  <g transform="translate(42 -21) scale(.85)">
    <ellipse cx="345" cy="309" rx="205" ry="10" fill="#2F5D50" opacity=".28"/>

