      <ellipse cx="478" cy="205" rx="44" ry="38"/>
      <ellipse cx="300" cy="262" rx="34" ry="22"/>
    </g>

    <!-- collier + clochette -->
    <path d="M138 252Q170 268 202 252" fill="none" stroke="#2F5D50" stroke-width="10" stroke-linecap="round"/>
    <circle cx="170" cy="270" r="11" fill="#E8B923"/>
    <path d="M163 273Q170 279 177 273" fill="none" stroke="#B88A12" stroke-width="2" stroke-linecap="round"/>
    <circle cx="170" cy="280" r="2.5" fill="#B88A12"/>

