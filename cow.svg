    <g fill="none" stroke="#E8D7A4" stroke-width="8" stroke-linecap="round">
      <path d="M140 130Q131 110 146 100"/>
      <path d="M200 130Q209 110 194 100"/>
    </g>

    <!-- oreilles -->
    <ellipse cx="108" cy="152" rx="30" ry="13" transform="rotate(-18 108 152)" fill="#2B2A26"/>
    <ellipse cx="108" cy="152" rx="17" ry="6" transform="rotate(-18 108 152)" fill="#C98480"/>
    <ellipse cx="232" cy="152" rx="30" ry="13" transform="rotate(18 232 152)" fill="#FFFDF8"/>
    <ellipse cx="232" cy="152" rx="17" ry="6" transform="rotate(18 232 152)" fill="#F2B5B0"/>

    <!-- tête -->
    <path d="M120 160C120 125 220 125 220 160C222 190 205 215 195 232L145 232C135 215 118 190 120 160Z" fill="#FFFDF8"/>
    <ellipse cx="135" cy="150" rx="30" ry="34" fill="#2B2A26" clip-path="url(#headClip)"/>
    <ellipse cx="170" cy="128" rx="14" ry="7" fill="#F0E8D6"/>
    <ellipse cx="170" cy="225" rx="35" ry="24" fill="#F2B5B0"/>
    <ellipse cx="141" cy="205" rx="9" ry="6" fill="#F2B5B0" opacity=".55"/>
    <ellipse cx="199" cy="205" rx="9" ry="6" fill="#F2B5B0" opacity=".55"/>
    <ellipse cx="158" cy="226" rx="4" ry="6" fill="#B5736F"/>
    <ellipse cx="182" cy="226" rx="4" ry="6" fill="#B5736F"/>
    <path d="M152 241Q170 249 188 241" fill="none" stroke="#B5736F" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="150" cy="176" rx="8.5" ry="7.5" fill="#FFFDF8"/>
    <ellipse cx="190" cy="176" rx="8.5" ry="7.5" fill="#FFFDF8"/>
    <circle cx="151" cy="177" r="4.8" fill="#2B2A26"/>
    <circle cx="191" cy="177" r="4.8" fill="#2B2A26"/>
    <circle cx="152.6" cy="175" r="1.5" fill="#FFFDF8"/>
    <circle cx="192.6" cy="175" r="1.5" fill="#FFFDF8"/>
  </g>

  <!-- herbe et pâquerettes au premier plan -->
  <g color="#3F7A62">
    <use href="#tuft" x="70" y="226"/><use href="#tuft" x="560" y="224"/>
    <use href="#tuft" x="150" y="246"/><use href="#tuft" x="500" y="244"/>
    <use href="#tuft" x="300" y="250"/><use href="#tuft" x="26" y="244"/>
  </g>
  <g color="#2F5D50">
    <use href="#tuft" x="236" y="262"/><use href="#tuft" x="420" y="260"/><use href="#tuft" x="606" y="258"/>
  </g>
  <use href="#daisy" transform="translate(48 218) scale(1.1)"/>
  <use href="#daisy" transform="translate(104 236) scale(1.4)"/>
  <use href="#daisy" transform="translate(22 258) scale(1.5)"/>
  <use href="#daisy" transform="translate(588 226) scale(1.3)"/>
  <use href="#daisy" transform="translate(532 244) scale(1.6)"/>
  <use href="#daisy" transform="translate(616 252) scale(1.2)"/>
  <use href="#daisy" transform="translate(190 256) scale(1.3)"/>
  <use href="#daisy" transform="translate(352 258) scale(1.5)"/>
  <use href="#daisy" transform="translate(470 254) scale(1.1)"/>
  <use href="#daisy" transform="translate(116 206) scale(.8)"/>
  <use href="#daisy" transform="translate(522 210) scale(.8)"/>
</svg>
